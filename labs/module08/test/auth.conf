// Test harness only: the Module 7 authoritative server for team01.example
// and the lab parent example. (unsigned here; signing is Module 7's job).
options {
    directory "@W@/auth";
    pid-file "@W@/auth/named.pid";
    listen-on port 53 { 192.0.2.1; };
    listen-on-v6 { none; };
    recursion no;
};
controls { };
zone "example" { type primary; file "@W@/auth/db.example"; };
zone "team01.example" { type primary; file "@W@/auth/db.team01.example"; };
