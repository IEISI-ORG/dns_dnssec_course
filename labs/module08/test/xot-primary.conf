// Test harness: zone transfer over TLS (RFC 9103), primary side (slide only, no lab)
options {
    directory "@W@/xot"; pid-file "@W@/xot/p.pid";
    listen-on port 53 { 192.0.2.2; };
    listen-on port 853 tls ephemeral { 192.0.2.2; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer port 853 transport tls { any; };   // add TSIG or an ACL in production
};
controls { };
zone "team01.example" { type primary; file "@W@/auth/db.team01.example"; };
