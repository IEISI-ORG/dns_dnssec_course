// Test harness: zone transfer over TLS (RFC 9103), secondary side
tls xot-client { };   // no ca-file: encrypted, server not authenticated
options {
    directory "@W@/xot"; pid-file "@W@/xot/s.pid";
    listen-on port 53 { 192.0.2.3; };
    listen-on-v6 { none; };
    recursion no;
};
controls { };
zone "team01.example" {
    type secondary;
    primaries { 192.0.2.2 port 853 tls xot-client; };
    file "@W@/xot/sec.db";
};
