# Test harness: Knot DNS 3.4 serving team01.example over DoQ (UDP 853).
# Instructor demo only; BIND 9.20 and Unbound 1.26 in Debian 13 do not serve DoQ.
server:
    rundir: "@W@/knot"
    listen: 192.0.2.40@53
    listen-quic: 192.0.2.40@853
    key-file: "@W@/res/resolver.key"
    cert-file: "@W@/res/resolver.crt"
control:
    listen: "@K@/knot.sock"
database:
    storage: "@W@/knot"
log:
  - target: "@W@/knot/knot.log"
    any: info
zone:
  - domain: team01.example
    file: "@W@/auth/db.team01.example"
