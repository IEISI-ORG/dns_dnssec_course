// Test harness only: the participant's resolver VM. The real lab resolver is
// the Module 7 validating resolver; validation is off here because the test
// namespace has no Internet and no root servers.
options {
    directory "@W@/res";
    pid-file "@W@/res/named.pid";
    recursion yes;
    allow-query { any; };
    dnssec-validation no;
    query-source address 192.0.2.10;
    listen-on port 53  { 192.0.2.10; };
    listen-on port 853 tls resolver-tls { 192.0.2.10; };                     // DoT
    listen-on port 443 tls resolver-tls http resolver-http { 192.0.2.10; };  // DoH
    listen-on-v6 { none; };
    response-padding { any; } block-size 468;
};
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { rndc-key; }; };
include "@W@/res/rndc.key";
zone "example" { type static-stub; server-addresses { 192.0.2.1; }; };
include "@W@/res/named.conf.module08";
