# Lab 8.3: Unbound on the client VM as a local forwarder that sends every
# query to the team resolver over DNS over TLS (strict: the name must match).
# Install as /etc/unbound/unbound.conf.d/module08-forward.conf; copy the team
# CA certificate (ca.crt, not ca.key) to /etc/unbound/team-ca.crt.
# Replace NN and 192.0.2.10 with your team number and resolver address.
server:
    interface: 127.0.0.1@5300        # port 5300: BIND already has port 53 here
    access-control: 127.0.0.0/8 allow
    tls-cert-bundle: "/etc/unbound/team-ca.crt"
    pad-queries: yes                 # default; 128-octet blocks (RFC 8467)
    # The team resolver validates (Module 7) and this hop is authenticated by
    # TLS, so the forwarder does not validate again.
    module-config: "iterator"

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 192.0.2.10@853#resolver.teamNN.example
