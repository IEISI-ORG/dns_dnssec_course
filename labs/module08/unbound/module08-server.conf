# Reference (not a lab step): the same DoT and DoH service on an Unbound
# resolver instead of BIND. Unbound 1.26 (Debian 13) is built with nghttp2,
# so it serves DoH itself.
server:
    interface: 192.0.2.20@53
    interface: 192.0.2.20@853        # DoT (tls-port)
    interface: 192.0.2.20@443        # DoH (https-port)
    tls-service-key: "/etc/unbound/resolver.key"
    tls-service-pem: "/etc/unbound/resolver.crt"
    tls-port: 853
    https-port: 443
    http-endpoint: "/dns-query"
    pad-responses: yes               # default; 468-octet blocks
