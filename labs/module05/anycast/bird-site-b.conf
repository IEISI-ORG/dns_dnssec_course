# Module 5, Labs 5.3-5.4: site B of the anycast service (AS 65100, the
# same origin AS at every site). It announces 198.51.100.53/32 to R2 while
# healthcheck.sh finds this site's named answering; healthcheck.sh turns
# the static protocol "svc" on and off with birdc.
router id 198.51.100.14;

protocol device { }

protocol static svc {
    disabled;                       # nothing announced until the first good check
    ipv4;
    route 198.51.100.53/32 blackhole;   # the address itself is on lo; this is only the announcement
}

protocol bgp r2 {
    local 198.51.100.14 as 65100;
    neighbor 198.51.100.13 as 65002;
    connect retry time 5;           # BIRD default 120 s: a peer that starts late waits that long
    ipv4 {
        import none;                # a site needs no routes back: its default route points at R2
        export where proto = "svc";
    };
}
