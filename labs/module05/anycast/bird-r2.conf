# Module 5, Labs 5.3-5.4: router R2, an ISP in city 2 (AS 65002).
# It hears the service prefix 198.51.100.53/32 from site B directly and
# from R1 (which hears it from site A), and puts the best path into its
# kernel routing table. Client C2 sits behind R2.
router id 198.51.100.13;

protocol device { }

protocol kernel {
    ipv4 { export all; };          # best BGP route -> this router's forwarding table
}

# Accept and pass on the service prefix only (RFC 8212: EBGP needs explicit policy)
filter service_only {
    if net = 198.51.100.53/32 then accept;
    reject;
}

protocol bgp site_b {
    local 198.51.100.13 as 65002;
    neighbor 198.51.100.14 as 65100;
    connect retry time 5;           # BIRD default 120 s: a peer that starts late waits that long
    ipv4 { import filter service_only; export none; };
}

protocol bgp r1 {
    local 198.51.100.10 as 65002;
    neighbor 198.51.100.9 as 65001;
    connect retry time 5;           # BIRD default 120 s: a peer that starts late waits that long
    ipv4 { import filter service_only; export filter service_only; };
}
