# Module 5, Labs 5.3-5.4: router R1, an ISP in city 1 (AS 65001).
# It hears the service prefix 198.51.100.53/32 from site A directly and
# from R2 (which hears it from site B), and puts the best path into its
# kernel routing table. Client C1 sits behind R1.
router id 198.51.100.1;

protocol device { }

protocol kernel {
    ipv4 { export all; };          # best BGP route -> this router's forwarding table
}

# Accept and pass on the service prefix only (RFC 8212: EBGP needs explicit policy)
filter service_only {
    if net = 198.51.100.53/32 then accept;
    reject;
}

protocol bgp site_a {
    local 198.51.100.5 as 65001;
    neighbor 198.51.100.6 as 65100;
    connect retry time 5;           # BIRD default 120 s: a peer that starts late waits that long
    ipv4 { import filter service_only; export none; };
}

protocol bgp r2 {
    local 198.51.100.9 as 65001;
    neighbor 198.51.100.10 as 65002;
    connect retry time 5;           # BIRD default 120 s: a peer that starts late waits that long
    ipv4 { import filter service_only; export filter service_only; };
}
