// Module 5, Labs 5.3-5.4: the DNS server at anycast site A, a second named
// on VM 2 inside network namespace m05-a. anycast-lab.sh installs it as
// /etc/bind/m05-anycast/a/named.conf: Debian's AppArmor profile lets named
// read /etc/bind and write /var/cache/bind, nowhere else that we need.
options {
    directory "/var/cache/bind/m05-anycast/a";
    pid-file none;                  // /run/named/named.pid is the VM's own named
    session-keyfile none;           // likewise /run/named/session.key
    listen-on { 198.51.100.53; 198.51.100.6; };   // the anycast address and this site's own
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
    server-id "site-a";             // returned as NSID (RFC 5001) and id.server (RFC 4892)
    querylog yes;
};
controls { };                       // no rndc channel; anycast-lab.sh signals the process
logging {
    channel main { file "/var/cache/bind/m05-anycast/a/named.log"; print-time yes; severity info; };
    channel q { file "/var/cache/bind/m05-anycast/a/query.log"; print-time yes; };
    category default { main; };
    category queries { q; };
};
zone "svc.test" {
    type primary;
    file "/etc/bind/m05-anycast/a/db.svc.test";
};
