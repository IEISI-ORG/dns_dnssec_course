include "/srv/dnslab/module07/auth/rndc.key";
controls { inet 127.0.0.1 port 9954 allow { 127.0.0.1; } keys { "rndc-key"; }; };
options {
    directory "/srv/dnslab/module07/res";
    pid-file "named.pid";
    session-keyfile "session.key";
    listen-on port 5301 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { localhost; };
    dnssec-validation auto;
};
trust-anchors {
    example. static-ds 29435 13 2 "00D828F978A7DED9ED7928C1E06445D7F8BA74C346BF44068443BCD67DFB4362";
};
zone "example" { type forward; forward only; forwarders { 127.0.0.1 port 5300; }; };
