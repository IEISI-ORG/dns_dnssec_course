include "/srv/dnslab/module07/auth/rndc.key";
controls { inet 127.0.0.1 port 9953 allow { 127.0.0.1; 127.0.0.1; } keys { "rndc-key"; }; };
options {
    directory "/srv/dnslab/module07/auth";
    pid-file "named.pid";
    session-keyfile "session.key";
    listen-on port 5300 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    key-directory "keys";
};
dnssec-policy "lab" {
    keys {
        ksk lifetime unlimited algorithm ecdsap256sha256;
        zsk lifetime P30D algorithm ecdsap256sha256;
    };
    nsec3param iterations 0 optout no salt-length 0;
    // classroom timings: minutes, not hours
    dnskey-ttl 60;
    max-zone-ttl 300;
    publish-safety 30;
    retire-safety 30;
    zone-propagation-delay 30;
    parent-ds-ttl 60;
    parent-propagation-delay 30;
};
dnssec-policy "lab2" {
    keys {
        ksk lifetime unlimited algorithm ecdsap256sha256;
        zsk lifetime P30D algorithm ecdsap256sha256;
    };
    nsec3param iterations 0 optout no salt-length 0;
    dnskey-ttl 60;
    max-zone-ttl 60;
    publish-safety 30;
    retire-safety 30;
    zone-propagation-delay 30;
    parent-ds-ttl 60;
    parent-propagation-delay 30;
    signatures-validity PT30M;
    signatures-validity-dnskey PT30M;
    signatures-refresh PT25M;
    signatures-jitter PT1M;
};
parental-agents "registry" { 127.0.0.1 port 5300; };
zone "example" { type primary; file "db.example"; dnssec-policy "lab"; };
zone "team1.example" { type primary; file "/srv/dnslab/module07/m71/db.team1.example.signed"; };
zone "team2.example" { type primary; file "db.team2.example"; dnssec-policy "lab"; parental-agents { "registry"; }; };
zone "team3.example" { type primary; file "/srv/dnslab/module07/brk/db.team3.example.signed"; };
zone "team4.example" { type primary; file "/srv/dnslab/module07/brk/db.team4.example.signed"; };
zone "team5.example" { type primary; file "db.team5.example"; dnssec-policy "lab2"; };
