# Module 4, VM 1: PowerDNS Authoritative Server next to BIND (Lab 4.3).
# Install as /etc/powerdns/pdns.d/module04.conf (owner root, group pdns,
# mode 640, like Debian's pdns.conf). Debian's pdns.conf reads every file in
# /etc/powerdns/pdns.d and sets nothing else that matters here.
# Replace 192.0.2.30 with your VM 1 address from the lab sheet.
# The API key is not in this file: Lab 4.3 makes one on the VM and puts it
# in /etc/powerdns/pdns.d/api-key.conf.
# Lab 4.4 stops and disables PowerDNS and deletes this file: Module 8 puts
# Unbound on 127.0.0.1 port 5300 of this VM.

# Zone data in an SQLite 3 database (the generic SQL backend "gsqlite3");
# Lab 4.3 creates the file from Debian's schema.
launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3

# BIND owns port 53 on this VM: PowerDNS answers on port 5300 only.
local-address=127.0.0.1, 192.0.2.30
local-port=5300

# The HTTP API (and the statistics web page) on this VM only.
api=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1, ::1

# One line per query in the journal (BIND: rndc querylog on).
log-dns-queries=yes
loglevel=5
