# Module 4, VM 2: Unbound next to BIND (Labs 4.2 and 4.4).
# Install as /etc/unbound/unbound.conf.d/module04.conf. Debian's
# unbound.conf includes every *.conf in that directory; its other two files
# turn on validation with the root trust anchor and unbound-control over
# /run/unbound.ctl. Replace NN, 192.0.2.10, 192.0.2.0/24 and the other
# addresses with your team number and the lab sheet's addresses.
# Lab 4.4 stops and disables Unbound again and deletes this file: BIND
# stays the resolver on port 53 for Modules 5-8.
server:
    # BIND owns port 53 on this VM: Unbound answers on port 5300 only.
    interface: 127.0.0.1@5300
    interface: 192.0.2.10@5300
    # Unbound refuses everyone but localhost until access-control allows them.
    access-control: 192.0.2.0/24 allow
    # The lab TLD is not in the real root: no validation at or below it
    # (BIND: validate-except).
    domain-insecure: "example"
    # One line per query in the journal (BIND: rndc querylog on).
    log-queries: yes

    # Lab 4.2 step 5: answers of Unbound's own (remove the # from both lines)
    # local-data: "printer.home.arpa. 60 IN A 192.0.2.99"
    # local-zone: "new.teamNN.example." always_nxdomain

# Ask the registry, an authoritative server, for everything under example.
# (BIND: zone "example" { type static-stub; server-addresses { ... }; };)
# Lab 4.2 steps 6-7 turn this into a forward-zone (forward-addr), then back.
stub-zone:
    name: "example"
    stub-addr: 192.0.2.53

# Lab 4.4 step 1: your zone from PowerDNS on VM 1, port 5300, instead of
# following the delegation to BIND on VM 1 (remove the # from three lines).
# stub-zone:
#     name: "teamNN.example"
#     stub-addr: 192.0.2.30@5300
