// Module 1 lab root server: serves a root zone "." whose only TLD is the
// lab's example. (the parent server), and root-servers.test, which holds
// the server's own name. Authoritative only.
options {
    directory "/var/lib/lab-m01";
    pid-file none;
    session-keyfile none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };
    minimal-responses no;    // answers carry the server addresses, as real roots do
    dnssec-validation no;    // authoritative only: no trust-anchor maintenance
};
controls { };
logging {
    channel out { stderr; print-time yes; print-category yes; severity info; };
    category default { out; };
    category lame-servers { null; };
};
zone "."                 { type primary; file "db.root"; };
zone "root-servers.test" { type primary; file "db.root-servers.test"; };
