// Module 1 lab child server: the second-level zones under example. for
// Labs 1.1-1.3: good.example is correct; the others carry one fault each (see
// ../README.md, the Lab 1.3 answer key). Authoritative only.
options {
    directory "/var/lib/lab-m01";
    pid-file none;
    session-keyfile none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };
    minimal-responses no;
    dnssec-validation no;    // authoritative only: no trust-anchor maintenance
};
controls { };
logging {
    channel out { stderr; print-time yes; print-category yes; severity info; };
    category default { out; };
    category lame-servers { null; };
};
zone "good.example"            { type primary; file "db.good.example"; };
zone "@M01_L_GLUE@.example"  { type primary; file "db.fault-stale-glue"; };
zone "@M01_L_NSSET@.example" { type primary; file "db.fault-ns-mismatch"; };
// @M01_L_NOTSERVED@.example is delegated to this server but deliberately not served.
