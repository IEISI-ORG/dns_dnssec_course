// Module 1 lab resolver: a recursive resolver for the classroom subnet whose
// root hints point at the lab root, so it resolves only the lab hierarchy
// (example. and below). No DNSSEC validation: the lab root is not signed.
options {
    directory "/var/lib/lab-m01";
    pid-file none;
    session-keyfile none;
    managed-keys-directory "/var/lib/lab-m01";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { @LAB_SUBNET@; localhost; };
    allow-query { @LAB_SUBNET@; localhost; };
    allow-query-cache { @LAB_SUBNET@; localhost; };
    dnssec-validation no;
};
controls { };
logging {
    channel out { stderr; print-time yes; print-category yes; severity info; };
    category default { out; };
    category lame-servers { null; };
    category resolver { null; };
};
zone "." { type hint; file "root.hints"; };
