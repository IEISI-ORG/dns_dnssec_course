# Instructor server for the DNS/DNSSEC workshop. See README.md.
#   docker compose up -d --build                 parent server (Modules 7-9)
#   docker compose --profile m08 up -d --build   adds the Knot DoQ demo
#     (or COMPOSE_PROFILES=m08 and DOQ_ADDR in .env)
#   docker compose --profile m01 up -d --build   adds the Module 1 lab root,
#     child and resolver (or COMPOSE_PROFILES=m01 and the M01_* addresses)
name: dnslab

x-bind-image: &bind-image
  build:
    context: ./images
    target: bind
    args: { DEBIAN_TAG: "${DEBIAN_TAG:-trixie-20261005-slim}" }
  image: dnslab/bind:local

x-lab-env: &lab-env
  PARENT_ADDR: ${PARENT_ADDR:?set PARENT_ADDR in .env}
  DOQ_ADDR: ${DOQ_ADDR:-}
  # empty M01_CHILD_ADDR: the Module 1 zones are not delegated (other days)
  M01_CHILD_ADDR: ${M01_CHILD_ADDR:-}
  M01_ROOT_ADDR: ${M01_ROOT_ADDR:-}
  M01_RESOLVER_ADDR: ${M01_RESOLVER_ADDR:-}
  M01_FAULT_LABELS: ${M01_FAULT_LABELS:-}
  TEAMS_FILE: /etc/lab-classroom/teams.conf
  HANDOUT_UID: ${HANDOUT_UID:-1000}
  HANDOUT_GID: ${HANDOUT_GID:-1000}

x-parent-volumes: &parent-volumes
  - parent-state:/var/lib/lab
  - ./parent:/etc/lab:ro
  # a directory, not the file: editors that replace teams.conf on save would
  # leave a single-file mount pointing at the old copy
  - type: bind
    source: ${CLASSROOM_DIR:-./classroom}
    target: /etc/lab-classroom
    read_only: true
    bind: { create_host_path: false }

services:
  # one-shot: keys, broken zones, db.example (runs on every `up`)
  init:
    <<: *bind-image
    command: ["/opt/lab/bin/lab-init"]
    environment: *lab-env
    volumes: *parent-volumes
    network_mode: none
    security_opt: [no-new-privileges:true]
    restart: "no"

  # the "registry": example., expired.example, wrongds.example
  parent:
    <<: *bind-image
    command: ["/opt/lab/bin/parent-run"]
    init: true
    environment: *lab-env
    volumes:
      - parent-state:/var/lib/lab
      - ./parent:/etc/lab:ro
      # a directory, not the file: editors that replace teams.conf on save would
      # leave a single-file mount pointing at the old copy
      - type: bind
        source: ${CLASSROOM_DIR:-./classroom}
        target: /etc/lab-classroom
        read_only: true
        bind: { create_host_path: false }
      - ${HANDOUT_DIR:-./handout}:/handout
    networks:
      lab: { ipv4_address: "${PARENT_ADDR}" }
    depends_on:
      init: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Module 8: DoQ demo on Knot DNS
  doq:
    profiles: [m08]
    build:
      context: ./images
      target: knot
      args: { DEBIAN_TAG: "${DEBIAN_TAG:-trixie-20261005-slim}" }
    image: dnslab/knot:local
    environment:
      DOQ_ADDR: ${DOQ_ADDR:-}
      HANDOUT_UID: ${HANDOUT_UID:-1000}
      HANDOUT_GID: ${HANDOUT_GID:-1000}
    volumes:
      - doq-state:/var/lib/knot-lab
      - ./knot:/etc/lab:ro
      - ${HANDOUT_DIR:-./handout}:/handout
    networks:
      lab: { ipv4_address: "${DOQ_ADDR:-set-DOQ_ADDR-in-.env}" }
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Module 1: lab root, second-level child zones and a lab resolver
  m01-root:
    <<: *bind-image
    profiles: [m01]
    command: ["/opt/lab/bin/m01-run", "root"]
    init: true
    environment: &m01-env
      PARENT_ADDR: ${PARENT_ADDR:?set PARENT_ADDR in .env}
      M01_ROOT_ADDR: ${M01_ROOT_ADDR:-}
      M01_CHILD_ADDR: ${M01_CHILD_ADDR:-}
      M01_RESOLVER_ADDR: ${M01_RESOLVER_ADDR:-}
      M01_FAULT_LABELS: ${M01_FAULT_LABELS:-}
      LAB_SUBNET: ${LAB_SUBNET:?set LAB_SUBNET in .env}
    volumes: ["./module01/root:/etc/lab/root:ro"]
    networks:
      lab: { ipv4_address: "${M01_ROOT_ADDR:-set-M01_ROOT_ADDR-in-.env}" }
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  m01-child:
    <<: *bind-image
    profiles: [m01]
    command: ["/opt/lab/bin/m01-run", "child"]
    init: true
    environment: *m01-env
    volumes: ["./module01/child:/etc/lab/child:ro"]
    networks:
      lab: { ipv4_address: "${M01_CHILD_ADDR:-set-M01_CHILD_ADDR-in-.env}" }
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  m01-resolver:
    <<: *bind-image
    profiles: [m01]
    command: ["/opt/lab/bin/m01-run", "resolver"]
    init: true
    environment: *m01-env
    volumes: ["./module01/resolver:/etc/lab/resolver:ro"]
    networks:
      lab: { ipv4_address: "${M01_RESOLVER_ADDR:-set-M01_RESOLVER_ADDR-in-.env}" }
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

# A profile's address left empty in .env must stop `up`: Docker would
# otherwise pick a free address itself, possibly one that belongs to another
# host on the classroom LAN. The placeholder default is not an address, so
# creating the container fails; with the profile off it is never used.
# (`:?` cannot be used here: Compose checks it even for inactive profiles.)
# Each service gets its own address on the classroom LAN. ipvlan L2 shares the
# host NIC's MAC address, so the hypervisor's virtual switch needs no
# promiscuous mode or MAC learning. The host itself cannot reach these
# addresses over its own NIC: use `docker compose exec`, or another machine.
networks:
  lab:
    driver: ipvlan
    driver_opts:
      parent: ${LAB_PARENT_IF:?set LAB_PARENT_IF in .env}
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: ${LAB_SUBNET:?set LAB_SUBNET in .env}
          gateway: ${LAB_GATEWAY:?set LAB_GATEWAY in .env}

volumes:
  parent-state:
  doq-state:
