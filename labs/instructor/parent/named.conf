// Parent ("registry") server for the lab TLD example.
// Serves example. (signed by the lab policy), expired.example and wrongds.example.
// Working files, keys and the generated db.example live in the parent-state volume.
include "/var/lib/lab/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

options {
    directory "/var/lib/lab";
    key-directory "keys";
    managed-keys-directory "/var/lib/lab";
    session-keyfile "session.key";
    pid-file none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };
    minimal-responses yes;
};

logging {
    channel out { stderr; print-time yes; print-category yes; severity info; };
    category default { out; };
    category dnssec { out; };
    category lame-servers { null; };
};

// The TTLs and delays of the Module 7 lab policy (dns_dnssec_workshop_plan.md),
// so DS changes reach team resolvers within a minute. Unlike the teams' copy,
// signatures keep BIND's default validity: example. must stay valid while the
// stack is down overnight.
dnssec-policy "lab" {
    keys {
        ksk lifetime unlimited algorithm ecdsap256sha256;
        zsk lifetime P30D algorithm ecdsap256sha256;
    };
    nsec3param iterations 0 optout no salt-length 0;
    dnskey-ttl 60;
    max-zone-ttl 60;
    publish-safety 30;
    retire-safety 30;
    zone-propagation-delay 30;
    parent-ds-ttl 60;
    parent-propagation-delay 30;
};

// db.example is generated by make-example-zone from teams.conf and ds/*.ds.
zone "example" { type primary; file "db.example"; dnssec-policy "lab"; };

// Lab 7.3 broken zones, signed by lab-init on every start.
zone "expired.example" { type primary; file "expired.example.signed"; };
zone "wrongds.example" { type primary; file "wrongds.example.signed"; };
