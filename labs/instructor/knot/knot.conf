# Knot DNS 3.4: DoQ demo for Module 8 (UDP 853). knot-run writes the zone,
# certificate and key into /var/lib/knot-lab before starting knotd.
server:
    rundir: "/var/lib/knot-lab/run"
    user: knot:knot
    listen: 0.0.0.0@53
    listen-quic: 0.0.0.0@853
    key-file: "/var/lib/knot-lab/doq.key"
    cert-file: "/var/lib/knot-lab/doq.crt"
database:
    storage: "/var/lib/knot-lab/db"
log:
  - target: stdout
    any: info
zone:
  - domain: doq.example
    file: "/var/lib/knot-lab/doq.example.zone"
