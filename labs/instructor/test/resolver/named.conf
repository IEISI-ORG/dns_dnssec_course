// Stand-in for a team's validating resolver in Lab 7.3 (test run only):
// the handout trust anchor plus a static-stub zone for example.
// The short cache TTLs only speed up the test.
options {
    directory "/var/lib/lab";
    pid-file none;
    session-keyfile "session.key";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { any; };
    dnssec-validation yes;
    max-cache-ttl 5;
    max-ncache-ttl 5;
};
logging {
    channel out { stderr; print-time yes; severity info; };
    category default { out; };
    category lame-servers { null; };
};
include "/handout/trust-anchors.conf";
zone "example" { type static-stub; server-addresses { 192.0.2.53; }; };
