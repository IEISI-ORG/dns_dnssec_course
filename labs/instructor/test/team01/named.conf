// Stand-in for a team's authoritative VM in Lab 7.2 (test run only).
options {
    directory "/var/lib/lab";
    key-directory "keys";
    pid-file none;
    session-keyfile "session.key";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
};
logging {
    channel out { stderr; print-time yes; severity info; };
    category default { out; };
    category dnssec { out; };
};
dnssec-policy "lab" {
    keys {
        ksk lifetime unlimited algorithm ecdsap256sha256;
        zsk lifetime P30D algorithm ecdsap256sha256;
    };
    nsec3param iterations 0 optout no salt-length 0;
    dnskey-ttl 60;
    max-zone-ttl 60;
    publish-safety 30;
    retire-safety 30;
    zone-propagation-delay 30;
    parent-ds-ttl 60;
    parent-propagation-delay 30;
    signatures-validity PT30M;
    signatures-validity-dnskey PT30M;
    signatures-refresh PT25M;
    signatures-jitter PT1M;
};
parental-agents "registry" { 192.0.2.53; };
zone "team01.example" {
    type primary;
    file "db.team01.example";
    dnssec-policy "lab";
    parental-agents { "registry"; };
};
